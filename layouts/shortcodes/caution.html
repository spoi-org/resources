{{- $title := .Get "title" | default (.Get 0) -}}
<div class="caution-box">
  <div class="caution-box-header">
    <svg class="caution-box-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <div class="caution-box-title">{{ $title | default "Caution" | markdownify }}</div>
  </div>
  <div class="caution-box-content">
    {{ .InnerDeindent | markdownify }}
  </div>
</div>
